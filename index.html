<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480">
  <title>HKO Warnings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: white;
      width: 800px;
      height: 480px;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #warnings {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 0;
      margin: 0;
      align-items: flex-start;
    }
    .warning-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: block;
    }
    .no-warning {
      font-size: 20px;
      color: #555;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div id="warnings">
    <div class="no-warning">載入中...</div>
  </div>

  <script>
    const HKO_URL = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc";

    const ICONS = {
      "WTS":    "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_12_ts.png",
      "WRAINA": "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_09_rain%20amber.png",
      "WRAINR": "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_10_rain%20red.png",
      "WRAINB": "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_11_rain%20black.png",
      "TC1":    "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_01_tc1.png",
      "TC3":    "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_02_tc3.png",
      "TC8NE":  "https://www.hko.gov.hk/en/wxinfo/dailywx/images/tc8ne.gif",
      "TC8SE":  "https://www.hko.gov.hk/en/wxinfo/dailywx/images/tc8b.gif",
      "TC8SW":  "https://www.hko.gov.hk/en/wxinfo/dailywx/images/tc8c.gif",
      "TC8NW":  "https://www.hko.gov.hk/en/wxinfo/dailywx/images/tc8d.gif",
      "TC9":    "https://www.hko.gov.hk/en/wxinfo/dailywx/images/tc9.gif",
      "TC10":   "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_08_tc10.png",
      "WHOT":   "https://www.hko.gov.hk/en/wxinfo/dailywx/images/vhot.gif",
      "WCOLD":  "https://www.hko.gov.hk/en/wxinfo/dailywx/images/cold.gif",
      "WMSGNL": "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_15_sms.png",
      "WL":     "https://www.hko.gov.hk/en/wxinfo/dailywx/images/landslip.gif",
      "WFROST": "https://www.hko.gov.hk/en/wxinfo/dailywx/images/frost.gif",
      "WFNTSA": "https://www.hko.gov.hk/en/wxinfo/dailywx/images/ntfl.gif",
      "WFIREY": "https://www.hko.gov.hk/en/wxinfo/dailywx/images/firey.gif",
      "WFIRER": "https://www.hko.gov.hk/en/wxinfo/dailywx/images/firer.gif"
    };

    // Preload common icons
    ["WTS","WRAINA","WRAINR","WRAINB","TC1","TC3","TC8NE","WHOT"].forEach(code => {
      const img = new Image();
      img.src = ICONS[code];
    });

    async function loadWarnings() {
      const container = document.getElementById("warnings");

      try {
        const res = await fetch(HKO_URL);
        const data = await res.json();

        const active = [];
        for (const [key, info] of Object.entries(data)) {
          if (!info || info.actionCode === "CANCEL") continue;
          const code = info.code || key;
          if (ICONS[code]) active.push(code);
        }

        const order = ["TC10","TC9","TC8NE","TC8SE","TC8SW","TC8NW","TC3","TC1",
                       "WRAINB","WRAINR","WRAINA","WTS","WL","WFNTSA","WMSGNL",
                       "WHOT","WCOLD","WFROST","WFIRER","WFIREY"];
        active.sort((a, b) => order.indexOf(a) - order.indexOf(b));

        container.innerHTML = "";

        if (active.length === 0) {
          container.innerHTML = '<div class="no-warning">目前沒有警告</div>';
          return;
        }

        const promises = active.map(code => {
          return new Promise(resolve => {
            const img = document.createElement("img");
            img.className = "warning-icon";
            img.src = ICONS[code];
            img.alt = code;
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            container.appendChild(img);
          });
        });

        await Promise.all(promises);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="no-warning">無法取得資料</div>';
      }
    }

    loadWarnings();
  </script>
</body>
</html>
